<g id="company-intro" data-pptx-bounds="64 240 1152 125">
<text x="64" y="273" fill="#111111" text-anchor="start"><tspan x="64" y="273"><tspan font-family="Instrument Sans">Outrise </tspan>为消费品牌与科技创业公司提供北美市场的营销支持。我们从业务目标和用户需求</tspan><tspan x="64" y="311">出发，明确市场方向、建立品牌表达，规划渠道与资源投入，并推进约定的关键营销工作。</tspan></text>
</g>
