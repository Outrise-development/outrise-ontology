<text x="464" y="518" fill="#111111" text-anchor="start"><tspan x="464" y="518">明确面向谁、表达什么价</tspan><tspan x="464" y="556">值、优先投入哪里，将业务</tspan><tspan x="464" y="594">目标转化为营销重点。</tspan></text>
</g>
