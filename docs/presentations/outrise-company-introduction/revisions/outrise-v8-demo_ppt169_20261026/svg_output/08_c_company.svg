<rect x="64" y="412" width="44" height="4" fill="#C9381E" />
<text x="64" y="465" font-family="Noto Sans SC Medium" font-size="32" fill="#111111" text-anchor="start"><tspan x="64" y="465">北美市场聚焦</tspan></text>
<text x="64" y="518" fill="#111111" text-anchor="start"><tspan x="64" y="518">围绕当地用户、市场环境与</tspan><tspan x="64" y="556">渠道特点，做出贴合目标市</tspan><tspan x="64" y="594">场的营销选择。</tspan></text>
</g>
