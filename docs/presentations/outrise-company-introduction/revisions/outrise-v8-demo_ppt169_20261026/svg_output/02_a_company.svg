<text x="64" y="205" fill="#111111" text-anchor="start"><tspan x="64" y="205"><tspan font-family="Instrument Sans">Outrise </tspan>为消费品牌与科技创业公司提供北美市场的营销</tspan><tspan x="64" y="243">支持。我们从业务目标和用户需求出发，明确市场方向、</tspan><tspan x="64" y="281">建立品牌表达，规划渠道与资源投入，并推进约定的关键</tspan><tspan x="64" y="319">营销工作。</tspan></text>
</g>
