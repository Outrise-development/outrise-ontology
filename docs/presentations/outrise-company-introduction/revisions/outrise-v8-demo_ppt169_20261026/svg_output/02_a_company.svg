<text x="64" y="514" fill="#111111" text-anchor="start"><tspan x="64" y="514">明确面向谁、表达什么价</tspan><tspan x="64" y="552">值、优先投入哪里，将业务</tspan><tspan x="64" y="590">目标转化为营销重点。</tspan></text>
