<g id="scope-note" data-pptx-bounds="64 610 1152 40">
<text x="64" y="638" font-size="22" fill="#62625D" text-anchor="start"><tspan x="64" y="638">每次合作共同明确：目标、交付、分工与评估方式。</tspan></text>
</g>
