<g id="opening" data-pptx-bounds="64 28 1152 116" fill="#FFFFFF" text-anchor="start">
<text x="64" y="52" font-family="Noto Sans SC Medium" font-size="18"><tspan x="64" y="52">如何与我们合作</tspan></text>
<text x="64" y="124" font-family="Noto Sans SC SemiBold" font-size="44"><tspan x="64" y="124">按业务阶段，选择合适的合作深度</tspan></text>
</g>
<g id="lead" data-pptx-bounds="64 148 1152 44">
<text x="64" y="180" fill="#FFFFFF" text-anchor="start"><tspan x="64" y="180">以策略咨询为核心，结合业务目标约定工作范围与执行支持。</tspan></text>
</g>
<g id="cooperation-1" data-pptx-bounds="64 242 378 364">
<rect x="64" y="246" width="48" height="4" fill="#C9381E" />
<text x="64" y="296" font-family="Noto Sans SC Medium" font-size="32" fill="#111111" text-anchor="start"><tspan x="64" y="296">策略咨询</tspan></text>
<text x="64" y="382" font-size="22" fill="#C9381E" text-anchor="start"><tspan x="64" y="382">需要厘清问题与方向</tspan></text>
<text x="64" y="430" fill="#111111" text-anchor="start"><tspan x="64" y="430">围绕市场、定位或渠道等明</tspan><tspan x="64" y="468">确问题，形成判断、建议与</tspan><tspan x="64" y="506">行动方向。</tspan></text>
<line x1="440" y1="246" x2="440" y2="600" stroke="#D6D4CB" stroke-width="1" />
</g>
<g id="cooperation-2" data-pptx-bounds="464 242 378 364">
<rect x="464" y="246" width="48" height="4" fill="#C9381E" />
<text x="464" y="296" font-family="Noto Sans SC Medium" font-size="32" fill="#111111" text-anchor="start"><tspan x="464" y="296">阶段性 <tspan font-family="Instrument Sans Medium">GTM</tspan>／</tspan><tspan x="464" y="340">品牌项目</tspan></text>
<text x="464" y="382" font-size="22" fill="#C9381E" text-anchor="start"><tspan x="464" y="382">需要推进阶段性目标</tspan></text>
<text x="464" y="430" fill="#111111" text-anchor="start"><tspan x="464" y="430">围绕明确的阶段目标，共同</tspan><tspan x="464" y="468">制定方案，完成规划与选定</tspan><tspan x="464" y="506">的关键执行。</tspan></text>
<line x1="840" y1="246" x2="840" y2="600" stroke="#D6D4CB" stroke-width="1" />
