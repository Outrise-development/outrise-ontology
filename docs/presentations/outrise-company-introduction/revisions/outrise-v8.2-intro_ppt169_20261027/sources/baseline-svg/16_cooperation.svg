<g id="cooperation-3" data-pptx-bounds="864 242 378 364">
<rect x="864" y="246" width="48" height="4" fill="#C9381E" />
<text x="864" y="296" font-family="Noto Sans SC Medium" font-size="32" fill="#111111" text-anchor="start"><tspan x="864" y="296">持续营销统筹</tspan><tspan x="864" y="340">与团队支持</tspan></text>
<text x="864" y="382" font-size="22" fill="#C9381E" text-anchor="start"><tspan x="864" y="382">需要持续判断与推进</tspan></text>
<text x="864" y="430" fill="#111111" text-anchor="start"><tspan x="864" y="430">持续参与重点讨论、资源协</tspan><tspan x="864" y="468">调与工作复盘。在持续合作</tspan><tspan x="864" y="506">中，我们承担类似外部 <tspan font-family="Instrument Sans">CMO</tspan></tspan><tspan x="864" y="544">的营销统筹职责，并按约定</tspan><tspan x="864" y="582">推进关键工作。</tspan></text>
