<g id="company-intro" data-pptx-bounds="64 240 1152 125">
<g fill="#111111" text-anchor="start"><text x="64.00000" y="273.00000" font-family="Instrument Sans" xml:space="preserve">Outrise </text><text x="157.76562" y="273.00000" xml:space="preserve">为消费品牌与科技创业公司提供北美市场的营销支持。我们从业务目标和用户需求</text><text x="64.00000" y="311.00000" xml:space="preserve">出发，明确市场方向、建立品牌表达，规划渠道与资源投入，并推进约定的关键营销工作。</text></g></g>
<g id="feature-1" data-pptx-bounds="64 410 352 217">
<rect x="64" y="412" width="44" height="4" fill="#C9381E" />
<g><text x="64.00000" y="465.00000" font-family="Noto Sans SC Medium" font-size="32" fill="#111111" text-anchor="start" xml:space="preserve">北美市场聚焦</text></g><g fill="#111111" text-anchor="start"><text x="64.00000" y="518.00000" xml:space="preserve">围绕当地用户、市场环境与</text><text x="64.00000" y="556.00000" xml:space="preserve">渠道特点，做出贴合目标市</text><text x="64.00000" y="594.00000" xml:space="preserve">场的营销选择。</text></g></g>
<g id="feature-2" data-pptx-bounds="464 410 352 217">
<rect x="464" y="412" width="44" height="4" fill="#C9381E" />
<g><text x="464.00000" y="465.00000" font-family="Noto Sans SC Medium" font-size="32" fill="#111111" text-anchor="start" xml:space="preserve">以策略判断为先</text></g><g fill="#111111" text-anchor="start"><text x="464.00000" y="518.00000" xml:space="preserve">明确面向谁、表达什么价</text><text x="464.00000" y="556.00000" xml:space="preserve">值、优先投入哪里，将业务</text><text x="464.00000" y="594.00000" xml:space="preserve">目标转化为营销重点。</text></g></g>
<g id="feature-3" data-pptx-bounds="864 410 352 217">
