<g fill="#111111" font-size="32" text-anchor="start"><text x="864.00000" y="465.00000" font-family="Instrument Sans Medium" xml:space="preserve">AI-native </text><text x="1008.68750" y="465.00000" font-family="Noto Sans SC Medium" xml:space="preserve">工作方式</text></g><g fill="#111111" text-anchor="start"><text x="864.00000" y="518.00000" font-family="Instrument Sans" xml:space="preserve">AI </text><text x="894.73438" y="518.00000" xml:space="preserve">融入研究、知识积累、任</text><text x="864.00000" y="556.00000" xml:space="preserve">务协同与内容生产，团队负</text><text x="864.00000" y="594.00000" xml:space="preserve">责商业判断与质量。</text></g></g>
