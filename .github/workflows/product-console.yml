name: Product console
on:
  push:
    paths: ['apps/product-console/**', '.github/workflows/product-console.yml']
  pull_request:
    paths: ['apps/product-console/**', '.github/workflows/product-console.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/product-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/product-console/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
